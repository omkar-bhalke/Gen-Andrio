name: Build APK (manual)

# Sirf manual run: Actions tab -> "Build APK (manual)" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "Debug"
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Debug' }}
      # Secrets set nahi ho to ye default test password use hoga
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || 'acs-test-pass-123' }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || 'acs-test-pass-123' }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          rm -f signing/signing-key.jks
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/signing-key.jks
            echo "Using keystore from KEYSTORE_BASE64 secret"
          else
            keytool -genkeypair -v -keystore signing/signing-key.jks -storetype JKS \
              -alias androidcs -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" \
              -dname "CN=MyApp, OU=Dev, O=Me, C=IN"
            echo "Generated a temporary keystore (new signature every run)"
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create directories AGP expects
        run: |
          mkdir -p core/app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies
          mkdir -p core/app/build/intermediates/external_file_lib_dex_archives/release/desugarReleaseFileDependencies
          mkdir -p core/app/build/intermediates/l8_art_profile/release/l8DexDesugarLibRelease

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew "assemble${BUILD_TYPE}" --stacktrace

      - name: Show APKs
        if: always()
        run: find . -name "*.apk" -path "*outputs*" -exec ls -lh {} \;

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.BUILD_TYPE }}
          path: core/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
